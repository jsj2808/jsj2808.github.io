<style>

@keyframes scoldShake{0%,100%{transform:translate(0,0) rotate(0deg)}15%{transform:translate(-10px,-6px) rotate(-3deg)}30%{transform:translate(10px,6px) rotate(3deg)}45%{transform:translate(-12px,4px) rotate(-4deg)}60%{transform:translate(12px,-4px) rotate(4deg)}75%{transform:translate(-6px,6px) rotate(-2deg)}}

const CAT_EDU={1:'patent',2:'repair',3:'net',4:'food',5:'build',7:'estate',8:'music',9:'biz',10:'biz'};

const AI_REQ_LIST=[
 {type:'edu',key:'repair',label:'🔧수리교육',req:30},
 {type:'edu',key:'music',label:'🎼작곡교육',req:30},
 {type:'edu',key:'net',label:'🤝인맥교육',req:30},
 {type:'edu',key:'biz',label:'📈사업교육',req:30},
 {type:'edu',key:'patent',label:'💡특허교육',req:30},
 {type:'stat',key:'tech',label:'💡기술력',req:300},
 {type:'stat',key:'biz',label:'📈사업수완',req:300}
];
function getAiStatus(){
 const edu=(state&&state.edu)||initEdu();
 return AI_REQ_LIST.map(r=>{
  const cur=r.type==='edu'?(edu[r.key]||0):(state?state[r.key]||0:0);
  return {...r,cur,ok:cur>=r.req};
 });
}
function isAiUnlocked(){return getAiStatus().every(x=>x.ok)}
// ===== 📜 특허청 정식등록 확률(최대 30%, 제니퍼 결혼 시 2배=최대 60%) & 강화 확률(최대 15%, 제니퍼 결혼 시 3배=최대 45%) & 필요 티켓 수 =====
function basePatentProb(){
 const p=(state&&state.edu&&state.edu.patent)||0;
 const m=(state&&state.edu&&state.edu.music)||0;
 return Math.min(30,Math.round((3+(p+m)*0.09)*10)/10);
}
function patentProb(){
 const b=basePatentProb();
 return (state&&state.marriedWifeId===9)?Math.round(b*2*10)/10:b;
}
function baseUpgradeProb(){
 const p=(state&&state.edu&&state.edu.patent)||0;
 const m=(state&&state.edu&&state.edu.music)||0;
 return Math.min(15,Math.round((1.5+(p+m)*0.045)*10)/10);
}
function upgradeProb(){
 const b=baseUpgradeProb();
 return (state&&state.marriedWifeId===9)?Math.round(b*3*10)/10:b;
}
function reqPatentTickets(){
 return 1+((state&&state.patentRegCount)||0);
}

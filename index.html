<script>

const initEdu=()=>({repair:0,food:0,music:0,net:0,build:0,estate:0,patent:0,biz:0,computer:0});
const diffMul=()=>(((state&&state.edu&&state.edu.computer)||0)>=25?.7:1); // 컴퓨터교육 이수 시 해금 난이도 -30%
const needEdu=s=>Math.ceil((s.reqEdu||0)*diffMul());

const AI_REQ_LIST=[
 {type:'edu',key:'repair',label:'🔧수리교육',req:30},
 {type:'edu',key:'music',label:'🎼작곡교육',req:30},
 {type:'edu',key:'net',label:'🤝매력교육',req:30},
 {type:'edu',key:'biz',label:'📈사업교육',req:30},
 {type:'edu',key:'patent',label:'💡특허교육',req:30},
 {type:'stat',key:'tech',label:'💡기술력',req:300},
 {type:'stat',key:'biz',label:'📈사업수완',req:300}
];
function getAiStatus(){
 const edu=(state&&state.edu)||initEdu();
 return AI_REQ_LIST.map(r=>{
  const cur=r.type==='edu'?(edu[r.key]||0):(state?state[r.key]||0:0);
  const need=Math.ceil(r.req*diffMul());return {...r,req:need,cur,ok:cur>=need};
 });
}
function isAiUnlocked(){return getAiStatus().every(x=>x.ok)}
// ===== 📜 특허청 정식등록 확률(최대 30%, 제니퍼 결혼 시 2배=최대 60%) & 강화 확률(최대 15%, 제니퍼 결혼 시 3배=최대 45%) & 필요 티켓 수 =====
function basePatentProb(){
 const p=(state&&state.edu&&state.edu.patent)||0;
 const m=(state&&state.edu&&state.edu.music)||0;
 return Math.min(30,Math.round((3+(p+m)*0.09)*10)/10);
}
function patentProb(){
 const b=basePatentProb();
 return (state&&state.marriedWifeId===9)?Math.round(b*2*10)/10:b;
}
function baseUpgradeProb(){
 const p=(state&&state.edu&&state.edu.patent)||0;
 const m=(state&&state.edu&&state.edu.music)||0;
 return Math.min(15,Math.round((1.5+(p+m)*0.045)*10)/10);
}
function upgradeProb(){
 const b=baseUpgradeProb();
 return (state&&state.marriedWifeId===9)?Math.round(b*3*10)/10:b;
}

 return 1+((state&&state.patentRegCount)||0);

['⚖️','한서연 (에이스 특허변리사)','#38bdf8',1,'🟢 특허·수리 수익 +35% & 분기 로열티 +400만','🔴 완벽주의 잔소리 분기 스트레스 +10',['특허 청구항이 아직 허술하네요. 기각입니다.','기술력과 사업 비전을 더 증명해 보이세요.'],'혼인 계약은 상호 이익이군요. 승인합니다! ⚖️'],

function ending(){const n=state.cash-state.debt,m=state.marriedWifeId!==null,cr=state.catRuns,top=Object.keys(cr).sort((a,b)=>cr[b]-cr[a])[0],t=+top;let i=9;
 if(n>=GOAL){i=(m&&state.reconciled)?10:(m?0:1)}else if(state.aiSynergy&&t===10)i=8;else if(t===9&&state.biz>=250)i=2;else if(t===7&&n>=5e9)i=3;else if(t===8&&state.art>=250)i=4;else if((t===1||t===2)&&state.tech>=250)i=5;else if(t===3&&state.net>=800)i=6;else if(n>=1e9)i=7;
 const al=ls('pm44_album',[]);if(!al.includes(i))al.push(i);lset('pm44_album',al);const hof=ls('pm44_hof',[]);hof.push({i:END[i][0],n:END[i][1],v:n,r:state.ngPlusCount});hof.sort((a,b)=>b.v-a.v);lset('pm44_hof',hof.slice(0,8));sfxFan();

 else if(s.marriedWifeId===9)t=`🎰 제니퍼와 동거 중(${s.specialTurns}분기 남음)! 특허 등록 2배(${patentProb().toFixed(1)}%)·강화 3배(${upgradeProb().toFixed(1)}%)일 때 특허청을 돌리세요! (종료 시 20억 잠적 주의!)`;
 else if(s.marriedWifeId===2)t=`🎻 유하은과 동거 중(${s.specialTurns}분기 남음 · +20턴 증가 완료)! 작곡 수익 +40% 및 분기 스트레스 -18 혜택을 누리세요!`;
 else if(s.wifeGrudge)t=`💢 복귀한 아내가 뒤끝(냉전) 상태입니다! 💍인연센터에서 기념일 선물(-500만)이나 명품 선물을 줘야 냉전이 풀립니다!`;
 else if(s.runawayWifeId!==null&&s.marriedWifeId===null)t=`🏃‍♀️ 가출했던 아내(${W[s.runawayWifeId][1].split(' ')[0]})가 돌아올 수 있습니다! (인연센터에서 복귀 시 응급실행 주의!)`;
 else if(((s.edu&&s.edu.computer)||0)<25&&s.turn%2===1)t='💻 🎓교육 탭의 컴퓨터교육을 이수하면 모든 해금 조건의 난이도가 30% 낮아집니다!';
 else if(!aiOk&&s.turn%2===0){
  const rem=getAiStatus().filter(x=>!x.ok).map(x=>`${x.label}(${x.cur}/${x.req})`).join(', ');
  t=`🤖AI 잠금해제까지 남은 조건: ${rem}`;
 }
 else if(s.patentTickets>=reqPatentTickets()&&!s.patentUsedInQuarter)t=`🎫티켓 ${s.patentTickets}장 보유! 이번 분기 📜특허청 정식등록(필요 티켓 ${reqPatentTickets()}장, 확률 ${patentProb().toFixed(1)}%)에 도전하세요!`;
 else if(aiOk&&done<6){const n=AI.find(a=>!r[a[0]]);t=`🤖AI 사업 해금 완료! (${done}/6 가동 중) 다음 추천: ${n[1]} ${n[2]}`}
 else{t=`🏬백화점 선물마다 선호하는 인물이 표시됩니다! 🎻유하은(🏠리빙·💄뷰티)은 +20턴, 🎰제니퍼(⌚주얼리·🍷미식)는 8분기 특허 버프를 줍니다!`}
 $('butlerDialogue').textContent=`"${t}"`;$('taxAuditRiskText').textContent=`세무위험: ${s.taxAuditRisk}%`;$('aiProgress').innerHTML=AI.map(a=>`<span title="${a[2]}" style="opacity:${r[a[0]]?1:.25}">${a[1]}</span>`).join('')
}
function ui(){const s=state,n=s.cash-s.debt;s.edu=s.edu||initEdu();['tech','biz','art'].forEach(k=>s[k]=Math.min(999,s[k]));s.net=Math.min(1999,s.net);$('topAge').textContent=`${s.age}세 ${s.quarter}분기`;$('topTurn').textContent=`(남은 ${s.turn}턴)`;$('topCash').textContent=won(s.cash);$('topDebt').textContent=won(s.debt);$('topPassive').textContent='+'+won(s.passive);$('rivalStatusText').textContent=`알렉스: ${won(s.rivalCash)}`;
 $('patentTicketBadge').textContent=`${s.patentTickets}장(요구:${reqPatentTickets()})`;
 const ab=$('agingBadge');if(s.age>=37){ab.textContent='완숙기(피로x1.3)';ab.className='text-[9.5px] px-1 rounded bg-rose-950 text-rose-300'}else if(s.age>=32){ab.textContent='도약기(피로x1.15)';ab.className='text-[9.5px] px-1 rounded bg-amber-950 text-amber-300'}else{ab.textContent='청년기(x1.0)';ab.className='text-[9.5px] px-1 rounded bg-emerald-950 text-emerald-300'}
 $('roomFrame').classList.toggle('crisis-alert',s.stress>=80);
 if(s.marriedWifeId!==null){const w=W[s.marriedWifeId];$('topRomanceBtnText').textContent='배우자:'+w[1].split(' ')[0]+(isSpecialWife(s.marriedWifeId)?`(${s.specialTurns}Q)`:s.wifeGrudge?'(💢)':'');$('spouseStatusBadge').textContent=isSpecialWife(s.marriedWifeId)?`${w[0]} 동거(${s.specialTurns}분기)`:`${w[0]} 행복 ${s.spouseHappiness}%${s.wifeGrudge?'💢':''}`}else{const c=s.candidates.filter(x=>x.met).length;$('topRomanceBtnText').textContent=s.runawayWifeId!==null?'🏃‍♀️와이프가출':`인연·청혼(${c}/10)`;$('spouseStatusBadge').textContent=s.runawayWifeId!==null?`🏃‍♀️ ${W[s.runawayWifeId][1].split(' ')[0]} 가출중`:`💔 싱글 (${c}/10)`}
 const pct=cl(n/GOAL*100,0,100),B=(l,v,c,mx=500)=>`<div><div class="flex justify-between"><span class="${c[0]} font-bold">${l}</span><span class="font-bold">${v}</span></div><div class="bar"><i style="width:${Math.min(100,v/mx*100)}%;background:${c[1]}"></i></div></div>`;
 const eduHtml=Object.entries(EDU_META).map(([k,m])=>{const v=s.edu[k]||0;return `<div class="bg-slate-900/90 border border-slate-800 px-1.5 py-0.5 rounded flex justify-between items-center"><span class="text-[9.5px] text-slate-300">${m.icon}${m.name}</span><b class="text-[9.5px]" style="color:${m.color}">${v}점</b></div>`}).join('');
 $('stats').innerHTML=B('💡 기술력(AI해금:300)',s.tech,['text-sky-300','#38bdf8'])+B('📈 사업수완(AI해금:300)',s.biz,['text-emerald-300','#34d399'])+B('🎨 감성예술',s.art,['text-purple-300','#c084fc'])+B('🤝 매력(최대1999)',s.net,['text-amber-300','#fbbf24'],1999)
  +B('🔥 스트레스(100=입원!)',s.stress,['text-rose-400','#f43f5e'],100)+`<div id="goalBarWrap"><div class="flex justify-between"><span class="text-amber-300 font-bold">${s.ngPlusCount>1?`🏆 ${s.ngPlusCount}회차(1,000억)`:'🏆 100억 달성률'}</span><span class="font-bold">${pct.toFixed(1)}%</span></div><div class="bar"><i style="width:${pct}%;background:#fbbf24"></i></div></div>`
  +`<div class="col-span-2 mt-1 pt-1 border-t border-slate-800"><div class="flex justify-between text-[9.5px] font-black text-emerald-300 mb-1"><span>🎓 8대 교육 고유 능력치</span><span class="text-amber-300">등록:${patentProb().toFixed(1)}% · 강화:${upgradeProb().toFixed(1)}%</span></div><div class="grid grid-cols-4 gap-1">${eduHtml}</div></div>`;
 if(s.marriedWifeId===6&&s.wifeAway)$('spouseStatusBadge').textContent='💻 김민지 잠적('+(3-(s.awayCnt||0))+'Q후)';if(s.concubineId===4)$('spouseStatusBadge').textContent+=' +💋첩';
 $('bottomLogTicker').innerHTML=s.logs.slice(0,2).join('');slots();brief()}

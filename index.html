  if(it.ticket){state.patentTickets+=it.ticket;state.lastRoyalty=it.roy||2e6;parts('🎫',6);log(`🎫 [${it.name}] 완수! 특허 출원권 티켓 +${it.ticket}장`,'text-sky-300 font-bold')}
  for(const[k,v]of Object.entries(it.st)){if(k==='stress'){let d=v;if(d>0){d=Math.floor(d*am);if(state.ownedItems.includes('espresso'))d=Math.floor(d*.75)}else if(state.ownedItems.includes('cello'))d=Math.floor(d*1.35);state.stress=cl(state.stress+d,0,100)}else state[k]=Math.min(999,state[k]+(k==='tech'&&state.ownedItems.includes('ai_pc')?Math.floor(v*1.3):v))}
  if(state.stress>=100){ov.classList.add('hidden');bar.style.width='0%';hospital(it.name);finishQuarter(true);return}
  if(state.marriedWifeId===null&&R()<.45){let t=W.findIndex(w=>w[3]===it.cat);if(t<0)t=Math.floor(R()*10);const c=state.candidates[t];c.met=true;c.affection=Math.min(100,c.affection+15);log(`💘 [${W[t][1]}]님과 마주쳐 호감도 ${c.affection}%`,'text-pink-300 font-bold')}
  sfxCoin();ui();await sleep(420)}
 ov.classList.add('hidden');bar.style.width='0%';finishQuarter(false)};
function finishQuarter(hosp){const q=hosp?[]:[...state.lastQueue];state.queue=[null,null,null];slots();state.patents.forEach(p=>{if(p.mature>0)p.mature--});let inc=state.passive;if(state.ownedItems.includes('gold_safe')&&state.cash>0)inc+=Math.floor(state.cash*.02);
 if(state.debt>0){const i=Math.floor(state.debt*.05);state.cash-=i;log(`🏦 대출 이자 -${won(i)}`,'text-rose-300')}
 if(state.marriedWifeId!==null&&!hosp){const w=state.marriedWifeId;state.spouseHappiness=Math.max(0,state.spouseHappiness-4);
  if(w===0){state.net+=15;state.cash-=12e6}else if(w===1){inc+=4e6;state.stress=Math.min(100,state.stress+10)}else if(w===2){state.stress=Math.max(0,state.stress-18);state.cash-=6e6}else if(w===3)state.tech+=10;
  else if(w===4){state.rivalCash=Math.max(5e6,state.rivalCash-15e6);state.stress=Math.min(100,state.stress+12);state.cash-=5e6}else if(w===5){inc+=8e6;state.cash-=15e6}else if(w===6)state.tech+=16;else if(w===7){state.net+=18;state.cash-=8e6;state.tech=Math.max(0,state.tech-5)}
  else if(w===8)state.stress=Math.max(0,state.stress-28);else if(w===9)state.cash+=R()<.5?3e7:-2e7;
  if(state.stress>=100)hospital('배우자 갈등 및 과로 누적');
  if(state.spouseHappiness<=10){const al=Math.max(1e7,Math.floor(state.cash*.2));state.cash=Math.max(0,state.cash-al);state.marriedWifeId=null;sfxAlarm();alertBox('💔 황혼 이혼 및 위자료 청구!',`${W[w][1]}님이 이혼 소송을 제기했습니다!\n위자료 -${won(al)}을 지급하고 다시 싱글이 되었습니다.`,'💔')}}
 state.cash+=inc;if(state.cash<0){state.debt+=-state.cash;state.cash=0}state.rivalCash+=Math.floor(R()*25e6)+12e6;if(!hosp)log(`분기 정산 완료 (패시브 +${won(inc)})`,'text-emerald-300 font-bold');
 q.forEach(id=>{const it=SC[id];if(it&&it.ai){state.aiRuns[it.ai]=(state.aiRuns[it.ai]||0)+1;if(state.aiRuns[it.ai]>1)state.passive+=Math.floor(it.pas*.2)}});
 if(!state.aiSynergy&&AI.every(a=>state.aiRuns[a[0]])){state.aiSynergy=true;state.passive+=3e6;state.tech+=10;state.biz+=10;alertBox('🤖 무자본 AI 6대 사업 완성!','유튜브·블로그·전자책·SaaS·대행·POD를 모두 가동했습니다.\n시너지: 분기 패시브 +300만, 기술력·사업수완 +10','🤖')}
 state.turn--;state.quarter++;if(state.quarter>4){state.quarter=1;state.age++}busy=false;ui();if(state.turn<=0||state.age>=64||state.cash-state.debt>=GOAL)ending()}
function ending(){const n=state.cash-state.debt,m=state.marriedWifeId!==null,cr=state.catRuns,top=Object.keys(cr).sort((a,b)=>cr[b]-cr[a])[0],t=+top;let i=9;
 if(n>=GOAL)i=m?0:1;else if(state.aiSynergy&&t===8)i=8;else if(t===6&&state.biz>=250)i=2;else if(t===4&&n>=5e9)i=3;else if(t===5&&state.art>=250)i=4;else if((t===0||t===1)&&state.tech>=250)i=5;else if(t===3&&state.net>=250)i=6;else if(n>=1e9)i=7;
 const al=ls('pm44_album',[]);if(!al.includes(i))al.push(i);lset('pm44_album',al);const hof=ls('pm44_hof',[]);hof.push({i:END[i][0],n:END[i][1],v:n,r:state.ngPlusCount});hof.sort((a,b)=>b.v-a.v);lset('pm44_hof',hof.slice(0,8));sfxFan();
 alertBox(`${END[i][0]} ${END[i][1]}`,`${state.age}세 최종 엔딩!\n배우자: ${m?W[state.marriedWifeId][1]:'독신'}\n최종 순자산: ${won(n)}\n[🏆전당·계승]에서 가보를 물려받아 2회차를 시작할 수 있습니다!`,END[i][0])}
// ===== 저장 / UI =====
function saveGameData(){lset('pm44_save',state);alertBox('저장 완료','저장되었습니다!','💾')}
function loadGameData(){const d=ls('pm44_save',null);if(!d)return alertBox('저장 없음','저장된 데이터가 없습니다.','📂');state=d;state.aiRuns=state.aiRuns||{};state.catRuns=state.catRuns||{};busy=false;ui();slots()}
function resetGameData(){if(!confirm('처음부터 다시 시작할까요?'))return;state=init();GOAL=1e10;busy=false;ui();slots()}
function brief(){const s=state,r=s.aiRuns,done=AI.filter(a=>r[a[0]]).length;let t;
 if(s.stress>=80)t=`주인님, 스트레스가 ${s.stress}입니다! 🏖️힐링으로 쉬어 가십시오. 입원하면 -1,500만 원입니다.`;
 else if(s.cash<5e5)t='자금이 바닥입니다. 🤖AI사업 탭의 무자본 모델은 비용 0원으로 시작할 수 있습니다!';
 else if(done<6){const n=AI.find(a=>!r[a[0]]);t=`무자본 AI 사업 ${done}/6 가동 중. 다음 추천: ${n[1]} ${n[2]}. 6개를 모두 열면 시너지 보너스!`}
 else if(s.patentTickets>0)t=`출원권 티켓 ${s.patentTickets}장 보유! 📜특허청에서 정식 등록하세요.`;
 else t='6대 AI 사업이 모두 가동 중입니다. 🏗️풀스택 파이프라인으로 확장해 보십시오!';
 $('butlerDialogue').textContent=`"${t}"`;$('taxAuditRiskText').textContent=`세무위험: ${s.taxAuditRisk}%`;$('aiProgress').innerHTML=AI.map(a=>`<span title="${a[2]}" style="opacity:${r[a[0]]?1:.25}">${a[1]}</span>`).join('')}
function ui(){const s=state,n=s.cash-s.debt;$('topAge').textContent=`${s.age}세 ${s.quarter}분기`;$('topTurn').textContent=`(${s.turn}턴)`;$('topCash').textContent=won(s.cash);$('topDebt').textContent=won(s.debt);$('topPassive').textContent='+'+won(s.passive);
 $('rivalStatusText').textContent=`알렉스: ${won(s.rivalCash)}`;$('patentTicketBadge').textContent=s.patentTickets+'장';
 const ab=$('agingBadge');if(s.age>=60){ab.textContent='노년기(피로x1.5)';ab.className='text-[9.5px] px-1 rounded bg-rose-950 text-rose-300'}else if(s.age>=52){ab.textContent='장년기(피로x1.25)';ab.className='text-[9.5px] px-1 rounded bg-amber-950 text-amber-300'}else{ab.textContent='중년기(x1.0)';ab.className='text-[9.5px] px-1 rounded bg-emerald-950 text-emerald-300'}
 $('roomFrame').classList.toggle('crisis-alert',s.stress>=80);
 if(s.marriedWifeId!==null){const w=W[s.marriedWifeId];$('topRomanceBtnText').textContent='배우자:'+w[1].split(' ')[0];$('spouseStatusBadge').textContent=`${w[0]} 행복 ${s.spouseHappiness}%`}else{const c=s.candidates.filter(x=>x.met).length;$('topRomanceBtnText').textContent=`인연·청혼(${c}/10)`;$('spouseStatusBadge').textContent=`💔 싱글 (${c}/10)`}
 const pct=cl(n/GOAL*100,0,100),B=(l,v,c,mx=500)=>`<div><div class="flex justify-between"><span class="${c[0]} font-bold">${l}</span><span class="font-bold">${v}</span></div><div class="bar"><i style="width:${Math.min(100,v/mx*100)}%;background:${c[1]}"></i></div></div>`;
 $('stats').innerHTML=B('💡 기술력',s.tech,['text-sky-300','#38bdf8'])+B('📈 사업수완',s.biz,['text-emerald-300','#34d399'])+B('🎨 감성예술',s.art,['text-purple-300','#c084fc'])+B('🤝 글로벌인맥',s.net,['text-amber-300','#fbbf24'])
  +B('🔥 스트레스(100=입원!)',s.stress,['text-rose-400','#f43f5e'],100)+B(s.ngPlusCount>1?`🏆 ${s.ngPlusCount}회차(1,000억)`:'🏆 100억 달성률',pct.toFixed(1)+'%',['text-amber-300','#fbbf24'],1e9);
 $('stats').lastElementChild.querySelector('i').style.width=pct+'%';
 $('bottomLogTicker').innerHTML=s.logs.slice(0,2).join('');slots();brief()}
board();ui();
